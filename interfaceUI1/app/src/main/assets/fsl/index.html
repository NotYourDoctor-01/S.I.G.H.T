<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Text to FSL</title>
<style>
  :root {
    --paper: #f1f4fa;  --surface: #ffffff;  --ink: #16213e;  --muted: #55627f;
    --line: #cdd6e8;   --cobalt: #184fbb;   --on-cobalt: #ffffff;
    --track: #dfe6f4;  --amber: #f5b83d;    --on-amber: #16213e;  --coral: #b3261e;
    --focus: #184fbb;
    --font: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0d1530;  --surface: #162247;  --ink: #e8eeff;  --muted: #a3b0d4;
      --line: #2c3b6b;   --cobalt: #5b8cf0;   --on-cobalt: #0d1530;
      --track: #22305c;  --coral: #ff8a80;    --focus: #f5b83d;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.5 var(--font);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app { max-width: 1120px; margin: 0 auto; padding: 1rem 1rem 3rem; }
  h1 { font-size: 1.05rem; font-weight: 700; margin: 0 0 1rem; letter-spacing: .01em; }
  h2 { font-size: 1rem; font-weight: 700; margin: 0 0 .5rem; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .layout { display: grid; gap: 1.25rem; }
  @media (min-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr); align-items: start; }
    .stage { position: sticky; top: 1rem; }
  }

  /* ---- stage: the video is the hero ---- */
  .screen {
    position: relative; aspect-ratio: 16 / 9; overflow: hidden;
    background: var(--cobalt); border-radius: 18px;
  }
  .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .now {
    min-height: 2.4rem; margin: .8rem 0 .5rem;
    font-size: clamp(1.5rem, 4.2vw, 2.1rem); font-weight: 700; line-height: 1.15; letter-spacing: -.01em;
  }
  .now.idle { color: var(--muted); font-weight: 500; font-size: 1.05rem; letter-spacing: 0; }

  /* timeline: one segment per sign, sized by duration, fills while it plays */
  .strip { list-style: none; margin: 0 0 .8rem; padding: 0; display: flex; flex-wrap: wrap; gap: 3px; }
  .strip li {
    flex: 1 1 calc(var(--d) * 3.4rem); min-width: 3.4rem; height: 2.1rem; padding: 0 .5rem;
    display: flex; align-items: center; border-radius: 6px; font-size: .8rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: linear-gradient(90deg, var(--amber) var(--p, 0%), var(--track) var(--p, 0%));
    color: var(--ink);
  }
  .strip li.done { --p: 100%; color: var(--on-amber); }
  .strip li.approx { outline: 2px dashed var(--coral); outline-offset: -2px; }
  .strip li.on { color: var(--on-amber); box-shadow: inset 0 0 0 2px var(--ink); }

  .transport { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
  .btn {
    border: 2px solid var(--line); background: var(--surface); border-radius: 10px;
    padding: .5rem .9rem; font-weight: 600; cursor: pointer; min-height: 2.75rem;
  }
  .btn:hover { border-color: var(--cobalt); }
  .btn[disabled] { opacity: .45; cursor: default; }
  .btn.primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--on-cobalt); }
  .seg { display: inline-flex; }
  .seg .btn { border-radius: 0; margin-left: -2px; }
  .seg .btn:first-child { border-radius: 10px 0 0 10px; margin-left: 0; }
  .seg .btn:last-child { border-radius: 0 10px 10px 0; }
  .seg .btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); position: relative; }

  .tones { display: inline-flex; gap: .35rem; align-items: center; margin-left: auto; }
  .tone { width: 2rem; height: 2rem; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
  .tone[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
  .note { margin: .3rem 0 0; color: var(--muted); font-size: .9rem; }

  /* ---- input ---- */
  .ask { display: flex; gap: .5rem; }
  .ask input {
    flex: 1; min-width: 0; font-size: 1.2rem; padding: .75rem 1rem;
    border: 2px solid var(--line); border-radius: 10px; background: var(--surface);
  }
  .ask input:focus { border-color: var(--cobalt); outline-offset: 0; }
  .ask .btn { font-size: 1rem; }
  .status { margin: .7rem 0 0; color: var(--muted); }
  .missing { margin: .4rem 0 0; color: var(--coral); font-weight: 600; }
  .missing:empty, .status:empty { display: none; }

  section.block { margin-top: 1.5rem; }
  .chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: .3rem .8rem; cursor: pointer; min-height: 2.25rem;
  }
  .chip:hover { border-color: var(--cobalt); }
  .signs-filter {
    width: 100%; margin: 0 0 .6rem; padding: .55rem .8rem; border: 2px solid var(--line);
    border-radius: 10px; background: var(--surface);
  }
  .signs-filter:focus { border-color: var(--cobalt); outline-offset: 0; }
  .signs-list { max-height: 16rem; overflow: auto; padding: .1rem; }
  .hint { color: var(--muted); font-size: .9rem; margin: .3rem 0 .6rem; }
</style>
</head>
<body>
<div class="app">
  <h1 id="title">Text to FSL</h1>
  <div class="layout">
    <section class="stage" aria-label="Sign video">
      <div class="screen" id="screen">
        <canvas id="stage" role="img" aria-label="Signing avatar"></canvas>
      </div>
      <p class="now idle" id="now" aria-live="polite">Type a sentence to see it signed.</p>
      <ol class="strip" id="strip" aria-label="Signs in this sentence"></ol>
      <div class="transport">
        <button class="btn" id="replay" type="button" disabled>Replay</button>
        <div class="seg" role="group" aria-label="Playback speed">
          <button class="btn" type="button" data-rate="0.6" aria-pressed="false">Slow</button>
          <button class="btn" type="button" data-rate="1" aria-pressed="true">Normal</button>
        </div>
        <div class="tones" role="group" aria-label="Skin tone" id="tones"></div>
      </div>
    </section>

    <div>
      <form class="ask" id="form" autocomplete="off">
        <label class="sr" for="q">Sentence to sign</label>
        <input id="q" type="text" maxlength="300" placeholder="Good morning, how are you?" enterkeyhint="go" autocapitalize="sentences">
        <button class="btn primary" type="submit">Show signs</button>
      </form>
      <p class="status" id="status" role="status"></p>
      <p class="missing" id="missing"></p>

      <section class="block" aria-labelledby="ex-h">
        <h2 id="ex-h">Try</h2>
        <ul class="chips" id="examples"></ul>
      </section>

      <section class="block" aria-labelledby="signs-h">
        <h2 id="signs-h">Signs you can use</h2>
        <p class="hint">Words outside this list are skipped. Tap one to watch it alone.</p>
        <input class="signs-filter" id="filter" type="search" placeholder="Filter signs" aria-label="Filter signs">
        <ul class="chips signs-list" id="signs"></ul>
      </section>
    </div>
  </div>
</div>

<script src="pack/lexicon.js"></script>
<script src="pack/motion.js"></script>
<script src="fsl.js"></script>
<script src="avatar.js"></script>
<script>
(function () {
  "use strict";
  const pack = window.FSL_PACK;
  const $ = id => document.getElementById(id);
  const now = $("now"), strip = $("strip"), status = $("status"), missing = $("missing");

  document.title = pack.name;
  $("title").textContent = pack.name;
  const player = new FSLAvatar.Player($("stage"), pack, window.FSL_MOTION);
  player.showRest();
  window.fslPlayer = player;                       // handy for debugging / screenshots
  const tonesEl = $("tones");
  FSLAvatar.TONES.forEach((c, i) => {
    const b = el("button", { type: "button", className: "tone", title: "Skin tone " + (i + 1) });
    b.style.background = c; b.setAttribute("aria-label", "Skin tone " + (i + 1));
    b.setAttribute("aria-pressed", String(i === 1));
    b.addEventListener("click", () => {
      tonesEl.querySelectorAll(".tone").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
      player.setSkin(c);
    });
    tonesEl.appendChild(b);
  });
  let lastPlaylist = [];

  function el(tag, props, text) {
    const e = document.createElement(tag);
    if (props) Object.assign(e, props);
    if (text != null) e.textContent = text;
    return e;
  }
  function say(text) { status.textContent = text || ""; }
  function listItem(child) { const li = document.createElement("li"); li.appendChild(child); return li; }

  function renderStrip(playlist) {
    strip.replaceChildren(...playlist.map(p => {
      const approx = pack.signs[p.label] && pack.signs[p.label].quality === "poor";
      const li = el("li", { title: p.label + (approx ? " (approximate)" : "") }, p.label);
      if (approx) li.classList.add("approx");
      li.style.setProperty("--d", Math.max(0.6, p.duration).toFixed(2));
      return li;
    }));
  }

  function run(playlist) {
    lastPlaylist = playlist;
    $("replay").disabled = !playlist.length;
    renderStrip(playlist);
    if (!playlist.length) return;
    const segs = [...strip.children];
    player.play(playlist, {
      onSign(item, i) {
        now.classList.remove("idle");
        now.textContent = item.label;
        segs.forEach((s, k) => { s.classList.toggle("on", k === i); s.classList.toggle("done", k < i); });
        document.dispatchEvent(new CustomEvent("fsl:sign", { detail: { label: item.label, index: i } }));
      },
      onTick(i, f) { segs[i].style.setProperty("--p", (f * 100).toFixed(1) + "%"); },
      onError(item) { say("Could not load the sign for \u201c" + item.label + "\u201d."); },
      onEnd() {
        segs.forEach(s => { s.classList.remove("on"); s.classList.add("done"); });
        document.dispatchEvent(new CustomEvent("fsl:end"));
      },
    });
  }

  function translate(text) {
    text = text.trim();
    if (!text) { say("Type a sentence first."); missing.textContent = ""; return; }
    const r = FSL.translate(text, pack);
    missing.textContent = "";
    if (!r.playlist.length) {
      player.stop(); run([]);
      now.classList.add("idle"); now.textContent = "Nothing to sign yet.";
      say("None of these words have a sign recorded yet.");
      if (r.skipped.length) missing.textContent = "No sign recorded yet for: " + r.skipped.join(", ") + ".";
      return;
    }
    if (r.skipped.length) {
      missing.textContent = "No sign recorded yet for: " + r.skipped.join(", ") + ".";
      say("Showing the words that have signs. This is a partial translation.");
    } else {
      say("");
    }
    const approx = r.playlist.filter(p => pack.signs[p.label] && pack.signs[p.label].quality === "poor").map(p => p.label);
    if (approx.length) {
      say((status.textContent ? status.textContent + " " : "") +
          "Approximate signs (hand shapes are estimated): " + [...new Set(approx)].join(", ") + ".");
    }
    run(r.playlist);
  }

  // ---- speed
  document.querySelectorAll("[data-rate]").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("[data-rate]").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
    player.setRate(parseFloat(b.dataset.rate));
  }));
  $("replay").addEventListener("click", () => run(lastPlaylist));

  // ---- form
  $("form").addEventListener("submit", e => { e.preventDefault(); translate($("q").value); });

  // ---- examples and sign list
  $("examples").replaceChildren(...pack.examples.map(t => {
    const b = el("button", { type: "button", className: "chip" }, t.charAt(0).toUpperCase() + t.slice(1));
    b.addEventListener("click", () => { $("q").value = b.textContent; translate(b.textContent); });
    return listItem(b);
  }));
  const allSigns = Object.keys(pack.signs);
  function renderSigns(filter) {
    const f = (filter || "").toLowerCase().trim();
    $("signs").replaceChildren(...allSigns.filter(g => g.includes(f)).map(g => {
      const b = el("button", { type: "button", className: "chip" }, g);
      b.addEventListener("click", () => { missing.textContent = ""; say(""); run(FSL.single_sign(g, pack)); });
      return listItem(b);
    }));
  }
  $("filter").addEventListener("input", e => renderSigns(e.target.value));
  renderSigns("");

  // deep link: index.html?q=good+morning
  const q = new URLSearchParams(location.search).get("q");
  if (q) { $("q").value = q; translate(q); } else { $("q").focus(); }
})();
</script>
</body>
</html>
